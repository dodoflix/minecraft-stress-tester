# Fetch free public proxies automatically (no registration, no payment) and spread the
# load across them. WARNING: free proxies are run by unknown third parties. Your traffic
# and your target's IP pass through them; only use this against a server you are authorized
# to test. The tool over-fetches and health-checks, keeping only the proxies a Minecraft
# server actually answers through.
authorized: true

target:
  # Must be a PUBLIC address you are authorized to test. Proxies connect from their own
  # machines, so they cannot reach a server on localhost/your LAN (127.0.0.1 won't work).
  host: play.example.com
  port: 25565

driver: light

ramp:
  count: 200
  connectRate: 20
  holdSeconds: 60

proxies:
  auto: true            # fetch + validate free socks5/socks4 proxies before the run
  autoValidate: true    # keep only proxies a Minecraft server actually answers through
  autoMax: 50           # target number of working proxies to use
  autoOverfetch: 2      # validate + keep up to autoMax * this, as a buffer against proxies dying mid-run
  # autoMaxProbes: 1000 # unset = probe the whole pool until the buffer is filled (slower). Set to cap.
  # autoConcurrency: 100
  # autoTimeoutMs: 4000
  maxPerProxy: 20      # bots per proxy. For one unique proxy per bot: maxPerProxy 1 and set
                        # autoMax >= count (free proxies rarely yield that many, though).

report:
  json: true
