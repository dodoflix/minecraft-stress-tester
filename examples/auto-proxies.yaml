# Fetch free public proxies automatically (no registration, no payment) and spread the
# load across them. WARNING: free proxies are run by unknown third parties. Your traffic
# and your target's IP pass through them; only use this against a server you are authorized
# to test. The tool over-fetches and health-checks, keeping only the reachable proxies.
authorized: true

target:
  host: 127.0.0.1
  port: 25565

driver: light

ramp:
  count: 200
  connectRate: 20
  holdSeconds: 60

proxies:
  auto: true            # fetch + validate free proxies before the run
  autoValidate: true    # keep only proxies that can actually reach the target
  autoMax: 50           # stop once this many working proxies are found
  autoMaxProbes: 1000   # how many of the fetched pool to health-check (higher = more, slower)
  # autoConcurrency: 100  # simultaneous health-checks
  # autoTimeoutMs: 4000   # per-proxy probe timeout
  # autoProviders: []   # empty = built-in free socks5/socks4/http lists; or supply your own URLs
  maxPerProxy: 20

report:
  json: true
