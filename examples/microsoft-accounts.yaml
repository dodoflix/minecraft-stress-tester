# Online-mode (premium) server, tested with a pool of real Microsoft accounts.
# On first run each account does the Xbox device-code flow (a code to enter in a browser);
# tokens are cached under profilesFolder so later runs are non-interactive.
authorized: true

target:
  host: 127.0.0.1
  port: 25565

driver: full

ramp:
  count: 3              # limited by how many accounts you have
  connectRate: 1
  holdSeconds: 120

accounts:
  mode: microsoft
  microsoftAccounts:
    - alice@example.com
    - bob@example.com
    - carol@example.com
  profilesFolder: ./.mcst-accounts

behaviors:
  antiAfk:
    enabled: true

report:
  json: true
