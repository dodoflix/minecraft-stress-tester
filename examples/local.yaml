# Example: stress test a local offline-mode server.
# Only run against servers you own or are permitted to test.
authorized: true

target:
  host: localhost
  port: 25565
  # version: 1.20.4   # omit to auto-detect from the server ping

driver: light          # light = raw protocol (scale) | full = mineflayer (realism)
viewDistance: 2        # chunks each bot requests; low keeps the client light (raise for chunk-load tests)
shards: 1              # worker processes to spread across cores; raise for big bot counts

ramp:
  count: 50            # bots to reach
  connectRate: 10      # new connections per second
  rampUpSeconds: 5     # climb from ~0 to connectRate over this window
  holdSeconds: 60      # keep them connected this long
  jitter: 0.2

reconnect:
  enabled: true
  maxRetries: 5
  baseBackoffMs: 1000
  maxBackoffMs: 30000

# Ordered per-bot behavior pipeline (replaces the old behaviors.* toggles). Each stage gates the
# next on success; add, remove, or reorder stages. Uncomment to enable more.
pipeline:
  - use: antiAfk        # head rotation (FullBot); keep-alive covers light bots
  # - use: movement     # random walk + chunk loading (FullBot only)
  #   with: { intervalMs: 2000 }
  # - use: auth         # offline-mode auth plugins (/register /login), runs first when present
  #   with: { password: "changeme" }
  # - use: chatSpam
  #   with: { message: "load test", delayMs: 3000 }

accounts:
  mode: offline        # offline | microsoft
  usernamePrefix: mcst
  microsoftAccounts: []           # emails to rotate over when mode: microsoft
  profilesFolder: ./.mcst-accounts

proxies:
  list: []             # e.g. ["socks5://user:pass@host:1080", "host:1080"]
  maxPerProxy: 50      # simultaneous bots per proxy (spreads source IPs)

# scenario: join-flood   # optional preset: join-flood | sustained-load | chat-flood | chunk-thrash

report:
  dir: ./reports
  json: true
  csv: false
  html: false
  mode: console        # console | tui (full-screen) | web (local dashboard)
  webPort: 8787
