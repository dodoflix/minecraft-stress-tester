# Start from a named scenario and override only what you need. The scenario seeds
# ramp/driver/pipeline; anything you set here (or pass on the CLI) wins.
authorized: true

scenario: chat-flood    # join-flood | sustained-load | chat-flood | chunk-thrash

target:
  host: 127.0.0.1
  port: 25565

shards: 2              # top-level overrides also stack on top of the scenario

ramp:
  count: 50             # override the scenario's default count
