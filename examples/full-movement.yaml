# Realistic game-logic load: mineflayer bots that walk around and force chunk loading.
# Fewer bots, but each parses the world and moves - heavier on the server than light bots.
authorized: true

target:
  host: 127.0.0.1
  port: 25565

driver: full            # mineflayer

ramp:
  count: 900
  connectRate: 10
  holdSeconds: 180

behaviors:
  antiAfk:
    enabled: true
  movement:
    enabled: true
    intervalMs: 1000    # pick a new direction each second

report:
  mode: web             # live web dashboard at http://localhost:8787
  json: true
