# Git hooks (installed via `lefthook install`, run automatically by `npm install`).
# pre-commit: fast - lint/format only the staged files.
# pre-push:   heavier - typecheck + the full unit suite before code leaves the machine.
pre-commit:
  commands:
    biome:
      glob: "*.{ts,js,json,jsonc}"
      # --no-errors-on-unmatched: don't fail when every staged file is biome-ignored
      # (e.g. only examples/*.json changed).
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixes: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    unit:
      run: npm run test:unit
